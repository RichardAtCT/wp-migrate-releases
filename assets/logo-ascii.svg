<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Glow filter for CLI mode -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .ascii-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      font-weight: 500;
      fill: currentColor;
      white-space: pre;
    }
  </style>

  <text class="ascii-text" x="50%" y="20" text-anchor="middle" dominant-baseline="hanging">
    <tspan x="50%" dy="0">  __        ______        __  __ _                 _</tspan>
    <tspan x="50%" dy="1.2em">  \ \      / /  _ \      |  \/  (_) __ _ _ __ __ _| |_ ___</tspan>
    <tspan x="50%" dy="1.2em">   \ \ /\ / /| |_) |_____| |\/| | |/ _` | '__/ _` | __/ _ \</tspan>
    <tspan x="50%" dy="1.2em">    \ V  V / |  __/______| |  | | | (_| | | | (_| | ||  __/</tspan>
    <tspan x="50%" dy="1.2em">     \_/\_/  |_|         |_|  |_|_|\__, |_|  \__,_|\__\___|</tspan>
    <tspan x="50%" dy="1.2em">                                   |___/</tspan>
  </text>
</svg>
